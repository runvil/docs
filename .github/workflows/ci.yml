name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build site
        run: go run github.com/runvil/runvil/cmd/runvil@v0.4.0 build
      - name: Verify site
        run: |
          test -f site/index.html
          test -f site/getting-started/index.html
          test -f site/framework/index.html
          test -f site/libraries/index.html
          test -f site/site-builder/index.html
          test -f site/ecosystem/index.html
          test -f site/tutorials/index.html
          test -f site/tutorials/01-build-a-documentation-site/index.html
          test -f site/assets/mdbind.css
